<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/enekem-medicals-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enekem Medicals</title>

    <style>
      #initial-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f7ff;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .initial-loader-icon-wrap {
        position: relative;
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .initial-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid rgba(16, 42, 67, 0.12);
        border-top-color: #2f8f68;
        animation: initialLoaderSpin 1.2s linear infinite;
      }

      .initial-loader-glow {
        position: absolute;
        inset: 10px;
        border-radius: 9999px;
        background: rgba(47, 143, 104, 0.12);
        animation: initialLoaderPulse 2s ease-in-out infinite;
      }

      .initial-loader-icon {
        position: relative;
        z-index: 1;
        width: 68px;
        height: 68px;
        animation: initialLoaderFloat 2.4s ease-in-out infinite;
      }

      .initial-loader-title {
        margin-top: 22px;
        color: #102a43;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .initial-loader-text {
        margin-top: 8px;
        color: #64748b;
        font-size: 14px;
      }

      .initial-loader-line {
        width: 130px;
        height: 4px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(16, 42, 67, 0.1);
      }

      .initial-loader-line::before {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: #2f8f68;
        animation: initialLoaderSweep 1.4s ease-in-out infinite;
      }

      @keyframes initialLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initialLoaderPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.75;
        }

        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes initialLoaderFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes initialLoaderSweep {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="initial-loader-content">
          <div class="initial-loader-icon-wrap">
            <span class="initial-loader-ring"></span>
            <span class="initial-loader-glow"></span>
            <img
              src="/enekem-medicals-icon.svg"
              alt="Enekem Medicals"
              class="initial-loader-icon"
            />
          </div>

          <p class="initial-loader-title">ENEKEM MEDICALS</p>
          <p class="initial-loader-text">Loading your care experience...</p>

          <div class="initial-loader-line"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
